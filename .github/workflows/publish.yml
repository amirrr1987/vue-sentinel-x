name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v1.0.0-beta.1
  workflow_dispatch:

permissions:
  contents: write      # to create GitHub Release
  id-token: write      # for npm provenance (OIDC)

jobs:
  # ── 1. guard: make sure the tag version matches package.json ──────────────
  validate:
    name: Validate tag vs package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract & validate version
        id: version
        run: |
          PKG_VERSION=$(jq -r '.version' packages/core/package.json)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${PKG_VERSION}"
            VERSION="${PKG_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match packages/core/package.json version ($PKG_VERSION)."
            echo "::error::Run: bun run version:patch  (or minor/major) then: git tag v$PKG_VERSION"
            exit 1
          fi
          echo "✓ Tag $TAG matches package.json version $PKG_VERSION"

  # ── 2. build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build all packages
        run: bun run build

      - name: Verify dist files
        run: |
          for file in \
            packages/core/dist/index.js \
            packages/core/dist/index.d.ts \
            packages/runtime/dist/index.js \
            packages/runtime/dist/index.d.ts \
            packages/vite-plugin/dist/index.js \
            packages/vite-plugin/dist/index.d.ts; do
            test -f "$file" && echo "✓ $file" || (echo "✗ MISSING: $file" && exit 1)
          done

  # ── 3. publish (core first, then dependents) ──────────────────────────────
  publish:
    name: Publish packages
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish        # optional: require manual approval in GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        run: bun run build

      - name: Verify dist before publish
        run: |
          for file in \
            packages/core/dist/index.js \
            packages/core/dist/browser.js \
            packages/runtime/dist/index.js \
            packages/vite-plugin/dist/index.js; do
            test -f "$file" && echo "✓ $file" || (echo "✗ MISSING: $file" && exit 1)
          done
          echo "--- core tarball preview ---"
          npm pack --dry-run --workspace @amirrr1987/vue-sentinel-x-core 2>&1 | tail -20

      - name: Require NPM_TOKEN (granular + bypass 2FA)
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is missing."
            echo "::error::Create a Granular Access Token on npmjs.com (scope @amirrr1987) with Read/Write and 'Bypass 2FA for publish' enabled."
            exit 1
          fi

      - name: Setup Node.js (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Determine npm tag
        id: npm_tag
        run: |
          if [ "${{ needs.validate.outputs.is_prerelease }}" = "true" ]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @amirrr1987/vue-sentinel-x-core
        working-directory: packages/core
        run: npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @amirrr1987/vue-sentinel-x-runtime
        working-directory: packages/runtime
        run: npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @amirrr1987/vue-sentinel-x-vite-plugin
        working-directory: packages/vite-plugin
        run: npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 4. GitHub Release (with changelog extract) ────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](./CHANGELOG.md) for details."
          fi
          # Write to file to avoid shell quoting issues
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.validate.outputs.version }}"
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
