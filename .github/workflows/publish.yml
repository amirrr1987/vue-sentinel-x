name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify publish artifacts
        run: node scripts/prepare-publish.mjs

      - name: Setup Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @vue-sentinel-x/core
        run: npm publish -w @vue-sentinel-x/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vue-sentinel-x/runtime
        run: npm publish -w @vue-sentinel-x/runtime --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vue-sentinel-x/vite-plugin
        run: npm publish -w @vue-sentinel-x/vite-plugin --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
