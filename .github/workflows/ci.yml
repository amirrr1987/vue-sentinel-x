name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify dist files
        run: |
          for file in \
            packages/core/dist/index.js \
            packages/core/dist/index.d.ts \
            packages/core/dist/browser.js \
            packages/core/dist/browser.d.ts \
            packages/runtime/dist/index.js \
            packages/runtime/dist/index.d.ts \
            packages/vite-plugin/dist/index.js \
            packages/vite-plugin/dist/index.d.ts; do
            test -f "$file" && echo "✓ $file" || (echo "✗ $file MISSING" && exit 1)
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            packages/core/dist/
            packages/runtime/dist/
            packages/vite-plugin/dist/
          retention-days: 3
